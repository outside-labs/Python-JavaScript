[project]
name = "Python-JavaScript"
version = "0.1.0"
description = "JavaScript-style objects, methods and functions for Python"
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "JavaScript-Fetch-API>=0.2.0,<0.3.0",
    "JavaScript-JSON>=0.1.0,<0.2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
keywords = ["javascript", "ecmascript", "objects", "arrays"]

[project.urls]
Homepage = "https://github.com/outside-labs/Python-JavaScript"
Repository = "https://github.com/outside-labs/Python-JavaScript"
Issues = "https://github.com/outside-labs/Python-JavaScript/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "JavaScript"
source-include = [
    "tests/test_*.py",
    "tests/fixtures/conformance.mjs",
    "docs/compatibility.md",
    "scripts/install_distribution.py",
    "CHANGELOG.md",
    "RELEASING.md",
]
