name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Require Node conformance runner
        run: node --version
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel with published dependencies
        run: python scripts/install_distribution.py wheel
      - name: Test installed wheel
        run: python -m unittest discover -s tests -v
      - name: Install source distribution with published dependencies
        run: python scripts/install_distribution.py sdist
      - name: Test installed source distribution
        run: python -m unittest discover -s tests -v
